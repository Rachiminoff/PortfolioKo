name: Supabase keep-alive

# Free-tier projects pause after 7 days of inactivity.
# Ping every 3 days so there is always a wide safety margin.
on:
  schedule:
    - cron: '0 3 */3 * *' # 03:00 UTC every 3rd day
  workflow_dispatch: # lets you run it manually from the Actions tab

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase (real DB read)
        env:
          SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -sS -o response.json -w '%{http_code}' \
            --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/rest/v1/blog_posts?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")
          echo "HTTP $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Ping failed:"; cat response.json; exit 1
          fi
